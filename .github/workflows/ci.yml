name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
      - name: Unit tests
        run: ./gradlew :core:chess:test :core:engine:test :engines:cuckoo:test testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Lint
        run: ./gradlew :app:lintDebug
